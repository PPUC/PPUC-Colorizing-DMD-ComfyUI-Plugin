[configuration]
id = "ComfyUI"
name = "ComfyUI Workflows"
description = "Runs colorized SD frames, backgrounds and sprites through a ComfyUI workflow, on this or another computer, and proposes the results for the HD plane"
author = "PPUC"
version = "0.1.0"
link = "https://github.com/PPUC/PPUC-Colorizing-DMD-ComfyUI-Plugin"

[libraries]
windows.x64 = "plugin-comfyui64.dll"
linux.x64 = "plugin-comfyui.so"
linux.aarch64 = "plugin-comfyui.so"
macos.arm64 = "plugin-comfyui.dylib"
